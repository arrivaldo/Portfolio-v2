<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
  Source of public/og.png (link previews on LinkedIn, WhatsApp, X, Slack). Same fonts as the site (Syne for the name,
  Open Sans, Fira Code). Render at 1200×630: open through the dev server and screenshot the page.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600&family=Fira+Code:wght@500&family=Open+Sans:wght@400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    padding: 80px 82px;
    background:
      radial-gradient(ellipse 60% 70% at 92% 40%, rgba(200, 108, 255, 0.32), transparent 70%),
      radial-gradient(ellipse 55% 60% at 70% 100%, rgba(126, 240, 255, 0.22), transparent 70%),
      #0d0d0d;
    color: #f2f2f2;
  }
  .logo { width: 104px; height: 104px; }
  h1 {
    margin-top: 72px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 74px;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  p {
    margin-top: 18px;
    font-family: 'Open Sans', sans-serif;
    font-size: 29px;
    color: #c9c9c9;
  }
  ul {
    position: absolute;
    left: 82px;
    bottom: 132px;
    display: flex;
    gap: 22px;
    list-style: none;
    font-family: 'Fira Code', monospace;
    font-size: 21px;
    color: #9a9a9a;
  }
  li + li::before { content: '·'; margin-right: 22px; }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 44 44">
    <defs>
      <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#7ef0ff" />
        <stop offset="50%" stop-color="#c86cff" />
        <stop offset="100%" stop-color="#ff7ac8" />
      </linearGradient>
    </defs>
    <circle cx="22" cy="22" r="21" fill="none" stroke="#f2f2f2" stroke-opacity=".35" stroke-width="1" />
    <path d="M11 12h12v4h-8v4h7v4h-7v4h8v4H11z" fill="#f2f2f2" />
    <path d="M25.5 32l6-20h4l-6 20z" fill="url(#g)" />
  </svg>
  <h1>Erick Rodríguez Bárcena</h1>
  <p>Software · Automation · Quality · Solutions Engineer</p>
  <ul>
    <li>9+ years</li>
    <li>22+ international projects</li>
    <li>AI &amp; automation</li>
  </ul>
</body>
</html>
